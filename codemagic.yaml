# Compilação do MultiplicaMente para iPhone/iPad no Codemagic (Mac na nuvem).
# Gera o .ipa assinado e envia para o App Store Connect (TestFlight).
#
# Antes de rodar, no site do Codemagic:
#   1. Teams → Integrations → Developer Portal: conectar uma chave de API do
#      App Store Connect com o nome "MultiplicaMente ASC".
#   2. Code signing identities → iOS: deixar o Codemagic gerar o certificado de
#      distribuição e o perfil "App Store" do pacote com.solano.multiplicamente.
workflows:
  ios-app-store:
    name: MultiplicaMente iOS (App Store)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: MultiplicaMente ASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.solano.multiplicamente
      node: 22
      xcode: latest
    triggering:
      events: []   # roda só quando você clicar em "Start new build"
    scripts:
      - name: Instalar dependências
        script: npm ci --legacy-peer-deps
      - name: Copiar o app (www) para o projeto iOS
        script: npx cap sync ios
      - name: Número do build (sempre maior que o anterior)
        script: |
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" ios/App/App.xcodeproj/project.pbxproj
      - name: Aplicar assinatura
        script: xcode-project use-profiles
      - name: Gerar o .ipa
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # Preenche no App Store Connect o que a revisão exige (privacidade, categoria,
  # direitos de conteúdo, compilação e contato). Não compila e não envia para revisão.
  # O telefone de contato é passado ao iniciar: variável REVIEW_CONTACT_PHONE.
  asc-preparar-revisao:
    name: App Store - preparar revisão
    instance_type: mac_mini_m2
    max_build_duration: 10
    integrations:
      app_store_connect: MultiplicaMente ASC
    triggering:
      events: []
    scripts:
      - name: Instalar dependências
        script: pip3 install --quiet "pyjwt[crypto]" || pip3 install --quiet --break-system-packages "pyjwt[crypto]"
      - name: Preencher App Store Connect
        script: python3 scripts/asc_preparar_revisao.py

  # Gera o .aab assinado e envia ao Google Play como RASCUNHO na faixa de teste interno.
  # Publicar (liberar para os usuários) continua sendo um clique no Play Console.
  # Pré-requisitos no Codemagic: keystore "multiplicamente_keystore" e o grupo de
  # variáveis "google_play" (GCLOUD_SERVICE_ACCOUNT_CREDENTIALS) neste app.
  android-google-play:
    name: MultiplicaMente Android (Google Play)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      android_signing:
        - multiplicamente_keystore
      groups:
        - google_play
      vars:
        PACKAGE_NAME: com.solano.multiplicamente
      node: 22
      java: 21
    triggering:
      events: []   # roda só quando for disparado
    scripts:
      - name: Instalar dependências
        script: npm ci --legacy-peer-deps
      - name: Copiar o app (www) para o projeto Android
        script: npx cap sync android
      - name: versionCode maior que o último do Google Play
        script: |
          ULTIMO=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" 2>/dev/null || echo 0)
          ATUAL=$(grep -o 'versionCode [0-9]*' android/app/build.gradle | grep -o '[0-9]*')
          NOVO=$(( ULTIMO >= ATUAL ? ULTIMO + 1 : ATUAL ))
          echo "Google Play: $ULTIMO | build.gradle: $ATUAL | usando: $NOVO"
          sed -i '' "s/versionCode [0-9]*/versionCode $NOVO/" android/app/build.gradle
      - name: Gerar o .aab assinado
        script: cd android && ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
