# Compilação do MultiplicaMente para iPhone/iPad no Codemagic (Mac na nuvem).
# Gera o .ipa assinado e envia para o App Store Connect (TestFlight).
#
# Antes de rodar, no site do Codemagic:
#   1. Teams → Integrations → Developer Portal: conectar uma chave de API do
#      App Store Connect com o nome "MultiplicaMente ASC".
#   2. Code signing identities → iOS: deixar o Codemagic gerar o certificado de
#      distribuição e o perfil "App Store" do pacote com.solano.multiplicamente.
workflows:
  ios-app-store:
    name: MultiplicaMente iOS (App Store)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: MultiplicaMente ASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.solano.multiplicamente
      node: 22
      xcode: latest
    triggering:
      events: []   # roda só quando você clicar em "Start new build"
    scripts:
      - name: Instalar dependências
        script: npm ci --legacy-peer-deps
      - name: Copiar o app (www) para o projeto iOS
        script: npx cap sync ios
      - name: Número do build (sempre maior que o anterior)
        script: |
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" ios/App/App.xcodeproj/project.pbxproj
      - name: Perfil de assinatura com "Entrar com a Apple"
        script: |
          # O perfil guardado no Codemagic é anterior ao "Sign in with Apple".
          # Aqui usamos (ou criamos uma vez) um perfil novo, que já inclui essa permissão.
          set -e
          NOME="MultiplicaMente Apple Login"
          ids() { python3 -c "import json,sys; d=json.load(sys.stdin); print(' '.join(x['id'] for x in d))"; }
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision
          EXISTE=$(app-store-connect profiles list --type IOS_APP_STORE --state ACTIVE --name "$NOME" --save --json | ids)
          if [ -z "$EXISTE" ]; then
            BUNDLE=$(app-store-connect bundle-ids list --bundle-id-identifier com.solano.multiplicamente --strict-match-identifier --json | ids)
            CERTS=$(app-store-connect certificates list --profile-type IOS_APP_STORE --json | ids)
            app-store-connect profiles create $BUNDLE --certificate-ids $CERTS --type IOS_APP_STORE --name "$NOME" --save
          fi
      - name: Aplicar assinatura
        script: xcode-project use-profiles
      - name: Gerar o .ipa
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # Preenche no App Store Connect o que a revisão exige (privacidade, categoria,
  # direitos de conteúdo, compilação e contato). Não compila e não envia para revisão.
  # O telefone de contato é passado ao iniciar: variável REVIEW_CONTACT_PHONE.
  asc-preparar-revisao:
    name: App Store - preparar revisão
    instance_type: mac_mini_m2
    max_build_duration: 10
    integrations:
      app_store_connect: MultiplicaMente ASC
    triggering:
      events: []
    scripts:
      - name: Instalar dependências
        script: pip3 install --quiet "pyjwt[crypto]" || pip3 install --quiet --break-system-packages "pyjwt[crypto]"
      - name: Preencher App Store Connect
        script: python3 scripts/asc_preparar_revisao.py
